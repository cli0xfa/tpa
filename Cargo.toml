[package]
name = "tpa"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "终端播放一切 — a cross-platform Unicode terminal video player"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.18"
crossbeam-channel = "0.5"
crossterm = "0.29"
ctrlc = { version = "3", features = ["termination"] }
ratatui = "0.30"
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
